apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jvminfo
  namespace: jvminfo
spec:
  ingressClassName: traefik
  rules:
    - host: jvminfo.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jvminfo
                port:
                  number: 8080
