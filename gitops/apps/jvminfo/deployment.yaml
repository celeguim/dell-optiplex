apiVersion: apps/v1
kind: Deployment
metadata:
  name: jmvminfo
  labels:
    app: jvminfo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: jvminfo
  template:
    metadata:
      labels:
        app: jvminfo
    spec:
      containers:
        - name: jvminfo
          image: celeguim/jvminfo:v11
          # readinessProbe:
          #   httpGet:
          #     path: /actuator/health
          #     port: 8080
          #   initialDelaySeconds: 2
          #   periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
